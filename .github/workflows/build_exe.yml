name: build-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pg8000 scramp requests PyQt5

      - name: Build onedir exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name SN_Report `
            --paths sn_report `
            --icon sn_report\favicon.ico `
            --add-data "sn_report\favicon.ico;." `
            --hidden-import pg8000.native `
            --hidden-import scramp `
            --hidden-import gp_gui `
            --hidden-import apple_style `
            --distpath dist `
            --workpath build `
            --specpath build `
            sn_report\gp_gui.py

      - name: Show output
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse | Select-Object -First 20 FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SN_Report_Windows
          path: dist/SN_Report

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SN_Report/SN_Report.exe
