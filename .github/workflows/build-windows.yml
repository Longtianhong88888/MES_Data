name: build-windows-exe

# 在 GitHub 的 Windows 服务器上自动打包 SN_Report.exe(免本地 Windows 机器)
# 用法: 仓库页面 -> Actions -> build-windows-exe -> Run workflow
#       完成后在 Artifacts 下载 SN_Report-windows-x64,解压得到 SN_Report.exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r NPD_EOL_FACA_Tool\requirements.txt

      - name: Build SN_Report.exe
        shell: cmd
        run: python -m PyInstaller --noconfirm --onefile --name SN_Report --paths NPD_EOL_FACA_Tool --hidden-import PIL --hidden-import openpyxl --hidden-import xlsxwriter --distpath NPD_EOL_FACA_Tool/dist --workpath NPD_EOL_FACA_Tool/build --specpath NPD_EOL_FACA_Tool/build NPD_EOL_FACA_Tool/run_sn_report.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SN_Report-windows-x64
          path: NPD_EOL_FACA_Tool/dist/SN_Report.exe
